name: Build and Release Theme

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.5' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install PHP quality tools
        run: composer install --no-interaction --prefer-dist

      - name: Check PHP syntax
        run: npm run check:php

      - name: Run PHP unit tests
        run: composer test

      - name: Run PHP static analysis
        run: composer analyse

      - name: Run WordPress coding standards
        run: composer lint

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate and test sources
        run: npm run check

      - name: Lint JavaScript and styles
        run: npm run lint

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  build:
    name: Build and Package
    runs-on: ubuntu-latest
    needs: [ php-quality, frontend-quality ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and package
        run: npm run dist

      - name: Verify archive
        run: unzip -t dist/twentytwentyfive-child.zip

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: twentytwentyfive-child-zip
          path: dist/twentytwentyfive-child.zip
          if-no-files-found: error
          retention-days: 14

  wordpress-smoke:
    name: WordPress package smoke test
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: wordpress
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Download release package
        uses: actions/download-artifact@v7
        with:
          name: twentytwentyfive-child-zip

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Install WordPress
        run: |
          wp core download --path=/tmp/child-theme-smoke --force
          wp config create --path=/tmp/child-theme-smoke --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp core install --path=/tmp/child-theme-smoke --url=http://example.test --title=Smoke --admin_user=admin --admin_password=smoke-test-password --admin_email=admin@example.test --skip-email
          wp theme install twentytwentyfive --path=/tmp/child-theme-smoke
          unzip -q twentytwentyfive-child.zip -d /tmp/child-theme-smoke/wp-content/themes
          wp theme activate twentytwentyfive-child --path=/tmp/child-theme-smoke

      - name: Verify block registration
        run: |
          wp eval '$blocks = WP_Block_Type_Registry::get_instance()->get_all_registered(); foreach (array("child/book-rating", "child/media-cover-grid", "child/post-likes", "child/visual-link-preview") as $name) { if (!isset($blocks[$name])) { throw new RuntimeException("Missing block: " . $name); } }' --path=/tmp/child-theme-smoke

  release:
    # Tag pushes are the single release path. Published-release events are intentionally
    # not handled here to avoid duplicate builds/uploads for the same version.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build, wordpress-smoke ]
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v7
        with:
          name: twentytwentyfive-child-zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: twentytwentyfive-child.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
